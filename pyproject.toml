[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valuo-backend"
version = "1.0.0"
description = "Valuo Real Estate Valuation & Machine Learning API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "statsmodels>=0.14.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "joblib>=1.3.0",
    "python-multipart>=0.0.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
